name: Check Extension

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compute-matrix:
    runs-on: ubuntu-latest
    outputs:
      mage-os: ${{ steps.mage-os.outputs.matrix }}
      magento-open-source: ${{ steps.magento-open-source.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: graycoreio/github-actions-magento2/supported-version@4de1565d1732187111b6d2eeb23c0ee3a9fc23b7 # v8.12.0
        id: mage-os
        with:
          project: mage-os
          kind: currently-supported
      # 2.4.8 (magento/framework 103.0.8) is the floor, so the still-supported 2.4.7 is left out.
      - uses: graycoreio/github-actions-magento2/supported-version@4de1565d1732187111b6d2eeb23c0ee3a9fc23b7 # v8.12.0
        id: magento-open-source
        with:
          project: magento-open-source
          kind: custom
          custom_versions: 'magento/project-community-edition:2.4.8-p5,magento/project-community-edition:2.4.9'

  check-extension-mage-os:
    needs: compute-matrix
    uses: graycoreio/github-actions-magento2/.github/workflows/check-extension.yaml@4de1565d1732187111b6d2eeb23c0ee3a9fc23b7 # v8.12.0
    with:
      matrix: ${{ needs.compute-matrix.outputs.mage-os }}
      magento_repository: https://repo.mage-os.org/

  check-extension-magento-open-source:
    needs: compute-matrix
    uses: graycoreio/github-actions-magento2/.github/workflows/check-extension.yaml@4de1565d1732187111b6d2eeb23c0ee3a9fc23b7 # v8.12.0
    with:
      matrix: ${{ needs.compute-matrix.outputs.magento-open-source }}

  composer-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
      - name: Resolve dependencies without installing them
        run: composer update --no-install --no-interaction --no-progress
      - name: Audit resolved dependencies
        run: composer audit --locked --no-dev
